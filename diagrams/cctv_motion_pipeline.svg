<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 420' width='1100' height='420'>
  <defs>
    <linearGradient id='bgGrad3' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#1e293b'/>
    </linearGradient>
    <marker id='arr' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 8 5 L 0 9 z' fill='#ec4899'/>
    </marker>
    <filter id='sh' x='-10%' y='-10%' width='130%' height='130%'>
      <feDropShadow dx='0' dy='4' stdDeviation='5' flood-color='#000000' flood-opacity='0.4'/>
    </filter>
  </defs>

  <rect width='100%' height='100%' fill='url(#bgGrad3)' rx='12'/>
  <rect x='10' y='10' width='1080' height='400' fill='none' stroke='#334155' stroke-width='1.5' rx='10'/>

  <text x='550' y='40' font-family='sans-serif' font-size='20' font-weight='bold' fill='#f8fafc' text-anchor='middle'>
    CCTV VIDEO PROCESSING &amp; MOTION DETECTION PIPELINE
  </text>
  <text x='550' y='65' font-family='sans-serif' font-size='12' fill='#94a3b8' text-anchor='middle'>
    Sequential Stages from Video Capture to Optical Flow Motion Extraction and Client HUD Overlay
  </text>

  <!-- Step 1 -->
  <g transform='translate(40, 95)' filter='url(#sh)'>
    <rect width='175' height='270' rx='8' fill='#1e293b' stroke='#db2777' stroke-width='1.5'/>
    <rect width='175' height='36' rx='8' fill='#9d174d'/>
    <text x='87' y='23' font-family='sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>1. VIDEO CAPTURE</text>
    <text x='15' y='65' font-family='sans-serif' font-size='11' font-weight='bold' fill='#f472b6'>Optical Input:</text>
    <text x='15' y='88' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Multi-camera array</text>
    <text x='15' y='110' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• 1080p / 720p stream</text>
    <text x='15' y='132' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Frame sampling:</text>
    <text x='25' y='152' font-family='sans-serif' font-size='11' fill='#cbd5e1'>15-30 FPS</text>
    <text x='15' y='180' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Stream protocols:</text>
    <text x='25' y='200' font-family='sans-serif' font-size='11' fill='#cbd5e1'>RTSP / WebRTC</text>
    <text x='15' y='230' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Raw YUV/RGB frames</text>
  </g>

  <!-- Arrow 1->2 -->
  <path d='M 215 230 L 255 230' stroke='#ec4899' stroke-width='2.5' fill='none' marker-end='url(#arr)'/>

  <!-- Step 2 -->
  <g transform='translate(255, 95)' filter='url(#sh)'>
    <rect width='175' height='270' rx='8' fill='#1e293b' stroke='#db2777' stroke-width='1.5'/>
    <rect width='175' height='36' rx='8' fill='#9d174d'/>
    <text x='87' y='23' font-family='sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>2. PREPROCESSING</text>
    <text x='15' y='65' font-family='sans-serif' font-size='11' font-weight='bold' fill='#f472b6'>Frame Normalization:</text>
    <text x='15' y='88' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Grayscale transform</text>
    <text x='15' y='110' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Downscaling to</text>
    <text x='25' y='130' font-family='sans-serif' font-size='11' fill='#cbd5e1'>640x360 for speed</text>
    <text x='15' y='155' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Gaussian Blur filter</text>
    <text x='25' y='175' font-family='sans-serif' font-size='11' fill='#cbd5e1'>(5x5 kernel size)</text>
    <text x='15' y='205' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• High-freq noise</text>
    <text x='25' y='225' font-family='sans-serif' font-size='11' fill='#cbd5e1'>suppression</text>
    <text x='15' y='250' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Smoothed intensity</text>
  </g>

  <!-- Arrow 2->3 -->
  <path d='M 430 230 L 470 230' stroke='#ec4899' stroke-width='2.5' fill='none' marker-end='url(#arr)'/>

  <!-- Step 3 -->
  <g transform='translate(470, 95)' filter='url(#sh)'>
    <rect width='175' height='270' rx='8' fill='#1e293b' stroke='#db2777' stroke-width='1.5'/>
    <rect width='175' height='36' rx='8' fill='#9d174d'/>
    <text x='87' y='23' font-family='sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>3. FRAME DIFFERENCE</text>
    <text x='15' y='65' font-family='sans-serif' font-size='11' font-weight='bold' fill='#f472b6'>Motion Computation:</text>
    <text x='15' y='88' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• ΔI = |I(t) - I(t-1)|</text>
    <text x='15' y='110' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Background model</text>
    <text x='25' y='130' font-family='sans-serif' font-size='11' fill='#cbd5e1'>subtraction (MOG2)</text>
    <text x='15' y='155' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Binary thresholding</text>
    <text x='25' y='175' font-family='sans-serif' font-size='11' fill='#cbd5e1'>Otsu / Fixed T=25</text>
    <text x='15' y='205' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Morphological</text>
    <text x='25' y='225' font-family='sans-serif' font-size='11' fill='#cbd5e1'>dilation &amp; erosion</text>
    <text x='15' y='250' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Motion mask generated</text>
  </g>

  <!-- Arrow 3->4 -->
  <path d='M 645 230 L 685 230' stroke='#ec4899' stroke-width='2.5' fill='none' marker-end='url(#arr)'/>

  <!-- Step 4 -->
  <g transform='translate(685, 95)' filter='url(#sh)'>
    <rect width='175' height='270' rx='8' fill='#1e293b' stroke='#db2777' stroke-width='1.5'/>
    <rect width='175' height='36' rx='8' fill='#9d174d'/>
    <text x='87' y='23' font-family='sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>4. OBJECT DETECTION</text>
    <text x='15' y='65' font-family='sans-serif' font-size='11' font-weight='bold' fill='#f472b6'>Visual Classification:</text>
    <text x='15' y='88' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Contour extraction</text>
    <text x='15' y='110' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Bounding box calc</text>
    <text x='15' y='132' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Area filter &gt; 500 px</text>
    <text x='15' y='155' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• YOLOv3 / MobileNet</text>
    <text x='25' y='175' font-family='sans-serif' font-size='11' fill='#cbd5e1'>inference pipeline</text>
    <text x='15' y='205' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Target classification</text>
    <text x='25' y='225' font-family='sans-serif' font-size='11' fill='#cbd5e1'>Person, Pet, Vehicle</text>
    <text x='15' y='250' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Bounding box &amp; label</text>
  </g>

  <!-- Arrow 4->5 -->
  <path d='M 860 230 L 900 230' stroke='#ec4899' stroke-width='2.5' fill='none' marker-end='url(#arr)'/>

  <!-- Step 5 -->
  <g transform='translate(900, 95)' filter='url(#sh)'>
    <rect width='160' height='270' rx='8' fill='#1e293b' stroke='#db2777' stroke-width='1.5'/>
    <rect width='160' height='36' rx='8' fill='#9d174d'/>
    <text x='80' y='23' font-family='sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>5. ALERT &amp; HUD</text>
    <text x='15' y='65' font-family='sans-serif' font-size='11' font-weight='bold' fill='#f472b6'>Client Integration:</text>
    <text x='15' y='88' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Motion HUD overlay</text>
    <text x='15' y='110' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Status badge:</text>
    <text x='25' y='130' font-family='sans-serif' font-size='11' fill='#4ade80'>'Active' / 'Motion'</text>
    <text x='15' y='155' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• MQTT motion event</text>
    <text x='25' y='175' font-family='sans-serif' font-size='11' fill='#cbd5e1'>dispatch to broker</text>
    <text x='15' y='205' font-family='sans-serif' font-size='11' fill='#cbd5e1'>• Web alert drawer</text>
    <text x='25' y='225' font-family='sans-serif' font-size='11' fill='#cbd5e1'>notification</text>
    <text x='15' y='250' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Real-time dashboard</text>
  </g>

  <text x='550' y='395' font-family='sans-serif' font-size='11' fill='#64748b' text-anchor='middle'>
    End-to-End Latency: &lt; 150 ms from camera frame acquisition to web HUD visual update.
  </text>
</svg>
