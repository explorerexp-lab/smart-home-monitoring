<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 550' width='1100' height='550'>
  <defs>
    <linearGradient id='bgGrad2' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0b1120'/>
      <stop offset='100%' stop-color='#1e293b'/>
    </linearGradient>
    <linearGradient id='l4Grad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#ea580c'/><stop offset='100%' stop-color='#f97316'/>
    </linearGradient>
    <linearGradient id='l3Grad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#7e22ce'/><stop offset='100%' stop-color='#a855f7'/>
    </linearGradient>
    <linearGradient id='l2Grad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#15803d'/><stop offset='100%' stop-color='#22c55e'/>
    </linearGradient>
    <linearGradient id='l1Grad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#1e40af'/><stop offset='100%' stop-color='#3b82f6'/>
    </linearGradient>
    <filter id='shadow2' x='-5%' y='-5%' width='110%' height='110%'>
      <feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#000000' flood-opacity='0.4'/>
    </filter>
  </defs>

  <rect width='100%' height='100%' fill='url(#bgGrad2)' rx='12'/>
  <rect x='10' y='10' width='1080' height='530' fill='none' stroke='#334155' stroke-width='1.5' rx='10'/>

  <text x='550' y='40' font-family='sans-serif' font-size='20' font-weight='bold' fill='#f8fafc' text-anchor='middle'>
    FOUR-LAYER IOT SYSTEM ARCHITECTURAL HIERARCHY
  </text>
  <text x='550' y='62' font-family='sans-serif' font-size='12' fill='#94a3b8' text-anchor='middle'>
    Structural Organization of Sensing, Transmission, Computation, and Presentation Tiers
  </text>

  <!-- LAYER 4: APPLICATION LAYER -->
  <g transform='translate(50, 85)' filter='url(#shadow2)'>
    <rect width='1000' height='90' rx='8' fill='#1e293b' stroke='#ea580c' stroke-width='1.5'/>
    <rect width='220' height='90' rx='8' fill='url(#l4Grad)'/>
    <text x='110' y='42' font-family='sans-serif' font-size='14' font-weight='bold' fill='#ffffff' text-anchor='middle'>APPLICATION LAYER</text>
    <text x='110' y='62' font-family='sans-serif' font-size='11' fill='#ffedd5' text-anchor='middle'>Human-Machine Interface</text>
    
    <text x='250' y='32' font-family='sans-serif' font-size='13' font-weight='bold' fill='#fdba74'>Web Dashboard &amp; Interactive Controls (Next.js 14 / React 18 / Tailwind CSS)</text>
    <text x='250' y='55' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Real-Time Sensor Telemetry Visualizer (Recharts)  • 24/7 CCTV Multi-feed HUD with Motion Alerts</text>
    <text x='250' y='75' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Bidirectional Room Actuation Controls (Thermostat, Lighting, Lock)  • Prioritized Alert Console</text>
  </g>

  <!-- LAYER 3: PROCESSING / MIDDLEWARE LAYER -->
  <g transform='translate(50, 195)' filter='url(#shadow2)'>
    <rect width='1000' height='90' rx='8' fill='#1e293b' stroke='#a855f7' stroke-width='1.5'/>
    <rect width='220' height='90' rx='8' fill='url(#l3Grad)'/>
    <text x='110' y='42' font-family='sans-serif' font-size='14' font-weight='bold' fill='#ffffff' text-anchor='middle'>PROCESSING LAYER</text>
    <text x='110' y='62' font-family='sans-serif' font-size='11' fill='#f3e8ff' text-anchor='middle'>Cloud &amp; Edge Computation</text>
    
    <text x='250' y='32' font-family='sans-serif' font-size='13' font-weight='bold' fill='#d8b4fe'>Next.js Full-Stack Web Server &amp; Route Handlers (Edge &amp; Node.js Runtimes)</text>
    <text x='250' y='55' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• REST API Endpoints: /api/sensors, /api/alerts, /api/controls, /api/cctv, /api/sensors/history</text>
    <text x='250' y='75' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Sensor Anomaly Detection Rules Engine  • Time-Series Telemetry Aggregator  • Vercel Edge Hosting</text>
  </g>

  <!-- LAYER 2: NETWORK LAYER -->
  <g transform='translate(50, 305)' filter='url(#shadow2)'>
    <rect width='1000' height='90' rx='8' fill='#1e293b' stroke='#22c55e' stroke-width='1.5'/>
    <rect width='220' height='90' rx='8' fill='url(#l2Grad)'/>
    <text x='110' y='42' font-family='sans-serif' font-size='14' font-weight='bold' fill='#ffffff' text-anchor='middle'>NETWORK LAYER</text>
    <text x='110' y='62' font-family='sans-serif' font-size='11' fill='#dcfce7' text-anchor='middle'>Transmission &amp; Protocols</text>
    
    <text x='250' y='32' font-family='sans-serif' font-size='13' font-weight='bold' fill='#86efac'>Low-Latency Transport Protocols &amp; Secure Channels</text>
    <text x='250' y='55' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• MQTT Protocol (v5.0 / v3.1.1) Pub/Sub via Mosquitto / EMQX Broker over TLS 1.3 (Port 8883/1883)</text>
    <text x='250' y='75' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Full-Duplex WebSockets (WSS)  • HTTP/2 REST APIs  • Wi-Fi 802.11 b/g/n &amp; TCP/IP Stack</text>
  </g>

  <!-- LAYER 1: PERCEPTION LAYER -->
  <g transform='translate(50, 415)' filter='url(#shadow2)'>
    <rect width='1000' height='90' rx='8' fill='#1e293b' stroke='#3b82f6' stroke-width='1.5'/>
    <rect width='220' height='90' rx='8' fill='url(#l1Grad)'/>
    <text x='110' y='42' font-family='sans-serif' font-size='14' font-weight='bold' fill='#ffffff' text-anchor='middle'>PERCEPTION LAYER</text>
    <text x='110' y='62' font-family='sans-serif' font-size='11' fill='#dbeafe' text-anchor='middle'>Physical Transducers &amp; Edge</text>
    
    <text x='250' y='32' font-family='sans-serif' font-size='13' font-weight='bold' fill='#93c5fd'>Physical Sensing Nodes, CCTV Cameras &amp; Actuators</text>
    <text x='250' y='55' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Transducers: DHT11/22 (Temp &amp; Hum), PIR HC-SR501 (Motion), LDR (Illumination), MQ-2 (Smoke)</text>
    <text x='250' y='75' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Microcontroller Gateway: ESP32 / Raspberry Pi 4 Hub  • Video: OV7670 / IP RTSP Live Streams</text>
  </g>

  <text x='550' y='525' font-family='sans-serif' font-size='11' fill='#64748b' text-anchor='middle'>
    Bidirectional Flow: Sensors feed upward to UI; Actuator control commands propagate downward to physical relays.
  </text>
</svg>
