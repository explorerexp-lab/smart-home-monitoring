<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650' width='1200' height='650'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#1e293b'/>
    </linearGradient>
    <linearGradient id='sensorGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#1e3a8a'/>
      <stop offset='100%' stop-color='#2563eb'/>
    </linearGradient>
    <linearGradient id='cctvGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#831843'/>
      <stop offset='100%' stop-color='#db2777'/>
    </linearGradient>
    <linearGradient id='hubGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#14532d'/>
      <stop offset='100%' stop-color='#16a34a'/>
    </linearGradient>
    <linearGradient id='cloudGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#581c87'/>
      <stop offset='100%' stop-color='#9333ea'/>
    </linearGradient>
    <linearGradient id='appGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#7c2d12'/>
      <stop offset='100%' stop-color='#ea580c'/>
    </linearGradient>
    <filter id='dropShadow' x='-10%' y='-10%' width='130%' height='130%'>
      <feDropShadow dx='0' dy='6' stdDeviation='8' flood-color='#000000' flood-opacity='0.5'/>
    </filter>
    <marker id='arrow' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 8 5 L 0 9 z' fill='#38bdf8'/>
    </marker>
    <marker id='arrowGreen' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 8 5 L 0 9 z' fill='#4ade80'/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width='100%' height='100%' fill='url(#bgGrad)' rx='12'/>
  <rect x='10' y='10' width='1180' height='630' fill='none' stroke='#334155' stroke-width='1.5' rx='10'/>

  <!-- Header -->
  <text x='600' y='45' font-family='sans-serif' font-size='22' font-weight='bold' fill='#f8fafc' text-anchor='middle' letter-spacing='1'>
    SMART HOME MONITORING SYSTEM: SYSTEM BLOCK DIAGRAM
  </text>
  <text x='600' y='70' font-family='sans-serif' font-size='13' fill='#94a3b8' text-anchor='middle'>
    Integrated Multi-Modal IoT Telemetry &amp; Real-Time Video Surveillance Pipeline
  </text>

  <!-- BLOCK 1: INPUT SENSORS & CCTV CAMERAS -->
  <g transform='translate(40, 100)' filter='url(#dropShadow)'>
    <rect width='240' height='490' rx='10' fill='#1e293b' stroke='#3b82f6' stroke-width='2'/>
    <rect width='240' height='40' rx='10' fill='url(#sensorGrad)'/>
    <text x='120' y='26' font-family='sans-serif' font-size='14' font-weight='bold' fill='#ffffff' text-anchor='middle'>1. PERCEPTION / INPUTS</text>

    <!-- Sub-block: Sensors -->
    <rect x='15' y='55' width='210' height='200' rx='8' fill='#0f172a' stroke='#1d4ed8' stroke-width='1.5'/>
    <text x='120' y='80' font-family='sans-serif' font-size='13' font-weight='bold' fill='#60a5fa' text-anchor='middle'>IoT Environmental Sensors</text>
    <line x1='25' y1='90' x2='215' y2='90' stroke='#334155' stroke-width='1'/>
    <text x='25' y='115' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• DHT11 / DHT22 (Temp &amp; Hum)</text>
    <text x='25' y='140' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• PIR HC-SR501 (Motion)</text>
    <text x='25' y='165' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• LDR Photoresistor (Light)</text>
    <text x='25' y='190' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• MQ-2 (Gas &amp; Smoke Anomaly)</text>
    <text x='25' y='215' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Software Telemetry Generator</text>
    <text x='25' y='238' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Rate: 1.0 - 5.0 sec telemetry cycle</text>

    <!-- Sub-block: CCTV Cameras -->
    <rect x='15' y='270' width='210' height='200' rx='8' fill='#0f172a' stroke='#be185d' stroke-width='1.5'/>
    <text x='120' y='295' font-family='sans-serif' font-size='13' font-weight='bold' fill='#f472b6' text-anchor='middle'>CCTV Vision Modules</text>
    <line x1='25' y1='305' x2='215' y2='305' stroke='#334155' stroke-width='1'/>
    <text x='25' y='330' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Kitchen Camera Feed</text>
    <text x='25' y='355' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Entrance / Doorway Feed</text>
    <text x='25' y='380' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Lounge / Living Room Feed</text>
    <text x='25' y='405' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Backyard &amp; Garage Feeds</text>
    <text x='25' y='430' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Optical Motion Detection</text>
    <text x='25' y='453' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Resolution: 1080p @ 30 FPS</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d='M 280 250 L 330 250' stroke='#38bdf8' stroke-width='3' fill='none' marker-end='url(#arrow)'/>
  <text x='305' y='240' font-family='sans-serif' font-size='10' fill='#38bdf8' text-anchor='middle'>GPIO / ADC</text>

  <path d='M 280 430 L 330 430' stroke='#f472b6' stroke-width='3' fill='none' marker-end='url(#arrow)'/>
  <text x='305' y='420' font-family='sans-serif' font-size='10' fill='#f472b6' text-anchor='middle'>RTSP / WebRTC</text>

  <!-- BLOCK 2: CENTRAL HUB / EDGE GATEWAY -->
  <g transform='translate(330, 100)' filter='url(#dropShadow)'>
    <rect width='240' height='490' rx='10' fill='#1e293b' stroke='#22c55e' stroke-width='2'/>
    <rect width='240' height='40' rx='10' fill='url(#hubGrad)'/>
    <text x='120' y='26' font-family='sans-serif' font-size='14' font-weight='bold' fill='#ffffff' text-anchor='middle'>2. CENTRAL HUB (EDGE)</text>

    <!-- Sub-block: Microcontroller Gateway -->
    <rect x='15' y='55' width='210' height='200' rx='8' fill='#0f172a' stroke='#15803d' stroke-width='1.5'/>
    <text x='120' y='80' font-family='sans-serif' font-size='13' font-weight='bold' fill='#4ade80' text-anchor='middle'>ESP32 / Raspberry Pi 4</text>
    <line x1='25' y1='90' x2='215' y2='90' stroke='#334155' stroke-width='1'/>
    <text x='25' y='115' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Dual Core Tensilica / ARMv8</text>
    <text x='25' y='140' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Analog/Digital Signal Sampling</text>
    <text x='25' y='165' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Local Anomaly Thresholding</text>
    <text x='25' y='190' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• FreeRTOS Task Scheduling</text>
    <text x='25' y='215' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Local JSON Serialization</text>
    <text x='25' y='238' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Built-in Wi-Fi 802.11 b/g/n</text>

    <!-- Sub-block: Actuator Drivers -->
    <rect x='15' y='270' width='210' height='200' rx='8' fill='#0f172a' stroke='#15803d' stroke-width='1.5'/>
    <text x='120' y='295' font-family='sans-serif' font-size='13' font-weight='bold' fill='#4ade80' text-anchor='middle'>Actuator Controller</text>
    <line x1='25' y1='305' x2='215' y2='305' stroke='#334155' stroke-width='1'/>
    <text x='25' y='330' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Relay Module (Smart Lighting)</text>
    <text x='25' y='355' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Thermostat Target Regulation</text>
    <text x='25' y='380' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Solenoid / Smart Lock Control</text>
    <text x='25' y='405' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Siren &amp; Buzzer Audio Alarm</text>
    <text x='25' y='430' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Closed-Loop Actuator Feedback</text>
    <text x='25' y='453' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>State synchronization confirmed</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d='M 570 300 L 620 300' stroke='#4ade80' stroke-width='3' fill='none' marker-end='url(#arrowGreen)'/>
  <text x='595' y='285' font-family='sans-serif' font-size='10' fill='#4ade80' text-anchor='middle'>MQTT / TLS</text>
  <path d='M 620 360 L 570 360' stroke='#38bdf8' stroke-width='3' fill='none' marker-end='url(#arrow)'/>
  <text x='595' y='380' font-family='sans-serif' font-size='10' fill='#38bdf8' text-anchor='middle'>Control CMD</text>

  <!-- BLOCK 3: CLOUD / NETWORK BROKER & WEB SERVER -->
  <g transform='translate(620, 100)' filter='url(#dropShadow)'>
    <rect width='240' height='490' rx='10' fill='#1e293b' stroke='#a855f7' stroke-width='2'/>
    <rect width='240' height='40' rx='10' fill='url(#cloudGrad)'/>
    <text x='120' y='26' font-family='sans-serif' font-size='14' font-weight='bold' fill='#ffffff' text-anchor='middle'>3. CLOUD / WEB SERVER</text>

    <!-- Sub-block: MQTT Broker -->
    <rect x='15' y='55' width='210' height='140' rx='8' fill='#0f172a' stroke='#7e22ce' stroke-width='1.5'/>
    <text x='120' y='80' font-family='sans-serif' font-size='13' font-weight='bold' fill='#c084fc' text-anchor='middle'>MQTT Broker / Network</text>
    <line x1='25' y1='90' x2='215' y2='90' stroke='#334155' stroke-width='1'/>
    <text x='25' y='115' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Mosquitto / EMQX (Port 1883)</text>
    <text x='25' y='140' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Topic: home/{room}/sensors</text>
    <text x='25' y='165' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• QoS Level 1: Guaranteed Delivery</text>

    <!-- Sub-block: Next.js Web Server Application -->
    <rect x='15' y='210' width='210' height='260' rx='8' fill='#0f172a' stroke='#7e22ce' stroke-width='1.5'/>
    <text x='120' y='235' font-family='sans-serif' font-size='13' font-weight='bold' fill='#c084fc' text-anchor='middle'>Next.js 14 Full-Stack Server</text>
    <line x1='25' y1='245' x2='215' y2='245' stroke='#334155' stroke-width='1'/>
    <text x='25' y='270' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Node.js Serverless Runtime</text>
    <text x='25' y='295' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• /api/sensors (Telemetry API)</text>
    <text x='25' y='320' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• /api/sensors/history (24h Trend)</text>
    <text x='25' y='345' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• /api/alerts (Event Processing)</text>
    <text x='25' y='370' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• /api/controls (Actuator Dispatch)</text>
    <text x='25' y='395' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• /api/cctv (Stream Switcher)</text>
    <text x='25' y='420' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Vercel Edge Global CDN</text>
    <text x='25' y='445' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Sub-50ms Global Response Time</text>
  </g>

  <!-- ARROW 3 -> 4 -->
  <path d='M 860 300 L 910 300' stroke='#38bdf8' stroke-width='3' fill='none' marker-end='url(#arrow)'/>
  <text x='885' y='285' font-family='sans-serif' font-size='10' fill='#38bdf8' text-anchor='middle'>HTTP / WS</text>
  <path d='M 910 360 L 860 360' stroke='#fb923c' stroke-width='3' fill='none' marker-end='url(#arrow)'/>
  <text x='885' y='380' font-family='sans-serif' font-size='10' fill='#fb923c' text-anchor='middle'>User Action</text>

  <!-- BLOCK 4: USER APPLICATION / DASHBOARD -->
  <g transform='translate(910, 100)' filter='url(#dropShadow)'>
    <rect width='250' height='490' rx='10' fill='#1e293b' stroke='#f97316' stroke-width='2'/>
    <rect width='250' height='40' rx='10' fill='url(#appGrad)'/>
    <text x='125' y='26' font-family='sans-serif' font-size='14' font-weight='bold' fill='#ffffff' text-anchor='middle'>4. USER APPLICATION</text>

    <!-- Sub-block: UI Features -->
    <rect x='15' y='55' width='220' height='415' rx='8' fill='#0f172a' stroke='#c2410c' stroke-width='1.5'/>
    <text x='125' y='80' font-family='sans-serif' font-size='13' font-weight='bold' fill='#fb923c' text-anchor='middle'>React 18 Dashboard UI</text>
    <line x1='25' y1='90' x2='225' y2='90' stroke='#334155' stroke-width='1'/>
    <text x='25' y='115' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Real-Time KPI Telemetry Cards</text>
    <text x='25' y='140' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Recharts Multi-Series Trend Line</text>
    <text x='25' y='165' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Room-by-Room Environmental Grid</text>
    <text x='25' y='190' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• 24/7 CCTV Live Video Grid &amp; HUD</text>
    <text x='25' y='215' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Real-Time Stream Switcher</text>
    <text x='25' y='240' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Optical Motion Detection Indicator</text>
    <text x='25' y='265' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Dynamic Thermostat Slider</text>
    <text x='25' y='290' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Room Lighting &amp; Lock Toggles</text>
    <text x='25' y='315' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Prioritized Event Alert Drawer</text>
    <text x='25' y='340' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Sound &amp; Visual Notification System</text>
    <text x='25' y='365' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Fully Responsive (Desktop/Mobile)</text>
    <text x='25' y='390' font-family='sans-serif' font-size='12' fill='#cbd5e1'>• Dark Mode Themed Interface</text>
    <text x='25' y='425' font-family='sans-serif' font-size='11' font-weight='bold' fill='#38bdf8'>Client: Next.js / TypeScript / Tailwind</text>
    <text x='25' y='448' font-family='sans-serif' font-size='10' font-style='italic' fill='#94a3b8'>Optimized for Vercel Deployment</text>
  </g>

  <!-- Bottom Legend / Info Bar -->
  <rect x='40' y='605' width='1120' height='25' rx='6' fill='#1e293b' stroke='#334155' stroke-width='1'/>
  <text x='600' y='622' font-family='sans-serif' font-size='11' fill='#94a3b8' text-anchor='middle'>
    Data Flow: Physical Environment &amp; Cameras ➔ Edge Hub &amp; Actuators ➔ MQTT/REST Cloud Server ➔ React Dashboard &amp; User Control Loop
  </text>
</svg>
